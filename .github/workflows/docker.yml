name: docker

# Builds the image on every PR and push to master.
# Pushes to ghcr.io only from master, a v* tag, or a manual run.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '.vscode/**'
      - 'chrome-extension/**'
      - 'releases/**'
      - '**/**.md'
  pull_request:
    paths-ignore:
      - '**/**.md'
  schedule:
    # weekly rebuild picks up new ffmpeg and deno releases
    - cron: '34 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: write version.json
        run: |
          echo "{\"type\": \"docker\", \"tag\": \"${GITHUB_REF_NAME}\", \"commit\": \"$(git rev-parse --short HEAD)\", \"date\": \"$(date +'%Y-%m-%d')\"}" > backend/version.json

      - name: setup platform emulator
        uses: docker/setup-qemu-action@v3

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v3

      - name: generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/youtubedl-material
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs build amd64 only to stay fast
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
